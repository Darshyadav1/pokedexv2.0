<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
     <title>Pokedex</title>
     <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
     
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
  </head>
  <body>
    
    <nav class="navbar navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Pokedex</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">Navigation</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">Home</a>
              </li>
              
              
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <main class="container pt-5 mt-4">
        
        {% block content %}
        {% endblock %}
    </main>

        <footer class="bg-body-tertiary border-top border-secondary-subtle py-4 mt-auto">
      <div class="container">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
          
          <div class="text-center text-sm-start">
            <p class="mb-1 fw-bold text-body small">
                Pokedex
            </p>
            <p class="mb-0 text-secondary x-small style-foot-note">
              Designed, built, and maintained with ❤️ by <span class="text-primary fw-medium"> <a href="https://desiralabs.vercel.app/">  desiralabs</a></span>.
            </p>
          </div>
          
          <div class="d-flex gap-4 text-secondary small style-foot-links">
            <span class="x-small"><i class="bi bi-shield-check me-1 text-success"></i> {% block leftf %}
                
            {% endblock leftf %}</span>
            <span class="x-small"><i class="bi bi-cpu-fill me-1 text-info"></i> Version 1.7</span>
          </div>

        </div>
      </div>
    </footer>

    <style>
      
      .x-small {
        font-size: 0.8rem;
      }
      .style-foot-note {
        letter-spacing: -0.01em;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
